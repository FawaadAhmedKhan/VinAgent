name: Deploy Production

on:
  workflow_run:
    workflows:
      - Deploy QA
    types:
      - completed
    branches:
      - develop

jobs:

  # ==========================================================
  # 1. Get EXACT image currently deployed to QA
  # ==========================================================
  deploy-staging:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment: Production

    steps:

      # --------------------------------------------------
      # Login to Azure
      # --------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------
      # Get image currently deployed to QA
      # --------------------------------------------------
      - name: Get QA Image
        run: |

          echo "Reading image currently deployed to QA..."

          QA_IMAGE=$(az webapp config container show \
            --name vinagent-api \
            --resource-group vinagent-api_group \
            --slot qa \
            --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
            -o tsv)

          echo "QA_IMAGE=$QA_IMAGE"

          if [ -z "$QA_IMAGE" ]; then
            echo "ERROR: Could not determine QA image."
            exit 1
          fi

          # Remove DOCKER| prefix if present
          QA_IMAGE="${QA_IMAGE#DOCKER|}"

          echo "Exact QA image:"
          echo "$QA_IMAGE"

          echo "QA_IMAGE=$QA_IMAGE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Verify image exists in ACR
      # --------------------------------------------------
      - name: Verify QA Image Exists
        run: |

          echo "Verifying image exists in ACR..."

          IMAGE_NAME="${QA_IMAGE#*/}"

          REPOSITORY="${IMAGE_NAME%%:*}"
          TAG="${IMAGE_NAME##*:}"

          echo "Repository: $REPOSITORY"
          echo "Tag: $TAG"

          az acr repository show \
            --name edata \
            --image "$REPOSITORY:$TAG"

          echo "QA image exists in ACR."

      # --------------------------------------------------
      # Deploy EXACT QA image to Staging
      # --------------------------------------------------
      - name: Deploy Same QA Image to Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: vinagent-api
          slot-name: staging
          images: ${{ env.QA_IMAGE }}

      # --------------------------------------------------
      # Verify staging image
      # --------------------------------------------------
      - name: Verify Staging Image
        run: |

          echo "Image configured on staging:"

          STAGING_IMAGE=$(az webapp config container show \
            --name vinagent-api \
            --resource-group vinagent-api_group \
            --slot staging \
            --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
            -o tsv)

          echo "$STAGING_IMAGE"

          EXPECTED="DOCKER|${QA_IMAGE}"

          if [ "$STAGING_IMAGE" != "$EXPECTED" ] && [ "$STAGING_IMAGE" != "$QA_IMAGE" ]; then
            echo "ERROR: Staging image does not match QA image."
            echo "Expected: $EXPECTED"
            echo "Actual:   $STAGING_IMAGE"
            exit 1
          fi

          echo "Staging is using the same image as QA."

      # --------------------------------------------------
      # Staging Health Check
      # --------------------------------------------------
      - name: Staging Health Check
        run: |

          echo "Waiting for staging application..."

          sleep 20

          echo "Checking staging health endpoint..."

          curl --fail \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            https://vinagent-api-staging-c6dae4bze9c9cpcu.westeurope-01.azurewebsites.net/health

          echo "Staging Health Check passed."

      # --------------------------------------------------
      # Staging Smoke Test
      # --------------------------------------------------
      - name: Staging Smoke Test
        run: |

          URL="https://vinagent-api-staging-c6dae4bze9c9cpcu.westeurope-01.azurewebsites.net/Vin/DetailsByVIN?vin=JTJBM7FX4A5005889"

          echo "Running staging smoke test..."

          STATUS=$(curl -s -o response.json -w "%{http_code}" "$URL")

          echo "HTTP Status: $STATUS"

          cat response.json

          if [ "$STATUS" -ne 200 ]; then
            echo "Staging smoke test failed."
            exit 1
          fi

          echo "Staging smoke test passed."


  # ==========================================================
  # 2. Swap Staging → Production
  # ==========================================================
  swap-production:

    needs: deploy-staging

    runs-on: ubuntu-latest

    environment: Production-Swap

    steps:

      # --------------------------------------------------
      # Login to Azure
      # --------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------
      # Swap
      # --------------------------------------------------
      - name: Swap Staging to Production
        run: |

          az webapp deployment slot swap \
            --name vinagent-api \
            --resource-group vinagent-api_group \
            --slot staging \
            --target-slot production

          echo "Staging successfully swapped to Production."

      # --------------------------------------------------
      # Production Health Check
      # --------------------------------------------------
      - name: Production Health Check
        run: |

          echo "Waiting for production application..."

          sleep 20

          echo "Checking production health endpoint..."

          curl --fail \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            https://vinagent-api-fdaqbubka5a3hvgj.westeurope-01.azurewebsites.net/health

          echo "Production Health Check passed."

      # --------------------------------------------------
      # Production Smoke Test
      # --------------------------------------------------
      - name: Production Smoke Test
        run: |

          URL="https://vinagent-api-fdaqbubka5a3hvgj.westeurope-01.azurewebsites.net/Vin/DetailsByVIN?vin=JTJBM7FX4A5005889"

          echo "Running production smoke test..."

          STATUS=$(curl -s -o response.json -w "%{http_code}" "$URL")

          echo "HTTP Status: $STATUS"

          cat response.json

          if [ "$STATUS" -ne 200 ]; then
            echo "Production smoke test failed."
            exit 1
          fi

          echo "Production smoke test passed."