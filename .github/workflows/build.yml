name: Build ASP.NET Core API

on:
  pull_request:
    branches:
      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x


    - name: Restore Packages
      run: dotnet restore


    - name: Build Application
      run: dotnet build --no-restore


    - name: Run Tests
      run: dotnet test --no-build
      
    # Static Code Analysis
    #- name: SonarQube Analysis
    #  uses: SonarSource/sonarqube-scan-action@v5
    #  env:
    #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    #   SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Dependency Vulnerability Scan
    - name: Dependency Vulnerability Scan
      run: |
        dotnet list package --vulnerable --include-transitive          
      
    - name: Build Docker Image
      run: docker build -t vehicleapi:${{ github.sha }} .



    # Docker Image Scan
    - name: Scan Docker Image
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        image-ref: vehicleapi:${{ github.sha }}
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 0
        
    # Azure Login
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}


    # Login to Azure Container Registry
    - name: Login to ACR
      run: |
        az acr login --name edata


    # Tag the image
    - name: Tag Docker Image
      run: |
        docker tag vehicleapi:${{ github.sha }} \
        edata.azurecr.io/vehicleapi:${{ github.sha }}

    # Push the image
    - name: Push Docker Image
      run: |
        docker push edata.azurecr.io/vehicleapi:${{ github.sha }}