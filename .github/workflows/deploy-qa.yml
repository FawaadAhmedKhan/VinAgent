name: Deploy QA

on:
  workflow_run:
    workflows:
      - Build ASP.NET Core API
    types:
      - completed

jobs:

  deploy-qa:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: QA

    steps:

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}


    - name: Deploy Image to QA Slot
      uses: azure/webapps-deploy@v3
      with:
        app-name: vinagent-api
        slot-name: QA
        images: edata.azurecr.io/vehicleapi:${{ github.event.workflow_run.head_sha }}