name: Deploy QA

on:
  push:
    branches:
      - develop

jobs:

  deploy-qa:

    runs-on: ubuntu-latest

    environment: QA

    steps:

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Image to QA Slot
      uses: azure/webapps-deploy@v3
      with:
        app-name: vinagent-api
        slot-name: qa
        images: edata.azurecr.io/vehicleapi:${{ github.sha }}